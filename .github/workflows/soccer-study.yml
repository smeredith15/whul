# Pull whole club soccer seasons from FotMob, player by player, so the league
# can choose how players are scored on them: FotMob's rating, the counting
# stats priced in whul/scoring/soccer_match.py, or both.
#
# Reads and writes no database. Uploads one CSV of player-match lines a
# competition and a short report, which is what the choice is made from.
#
# A season of one league is roughly 380 requests and ten minutes; the six
# leagues together about an hour. Finished matches are kept in the cache
# below, so a rerun -- or a later season added beside an earlier one -- does
# not ask for the same match twice.

name: Soccer study

on:
  workflow_dispatch:
    inputs:
      competitions:
        description: >-
          FotMob competitions, space separated: epl laliga seriea bundesliga
          ligue1 mls nwsl ucl uel uecl facup efl_cup dfbpokal coppaitalia
          copadelrey coupedefrance
        default: "epl laliga seriea bundesliga ligue1 mls"
      season:
        description: "The year the season starts: 2024 is 2024-25, and MLS 2024"
        default: "2024"
      limit:
        description: "At most this many matches a competition (empty for all)"
        default: ""

permissions:
  contents: read

jobs:
  study:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e .

      - name: Restore the FotMob cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache/fotmob
          key: fotmob-${{ github.run_id }}
          restore-keys: |
            fotmob-

      - name: Pull the seasons
        # Stopped before the runner's six-hour limit, which would cancel the
        # job outright and save nothing; stopping first keeps every match read
        # so far for the rerun.
        timeout-minutes: 330
        continue-on-error: true
        run: |
          set -o pipefail
          FLAGS=""
          if [ -n "${{ inputs.limit }}" ]; then FLAGS="--limit ${{ inputs.limit }}"; fi
          python -m whul.cli soccer-study --competitions ${{ inputs.competitions }} \
            --season "${{ inputs.season }}" --out study $FLAGS

      - name: Keep what was read
        # Saved here, and whatever happened above, rather than by the restore
        # step's own post-run save: that one runs only when the whole job
        # succeeds, so a run that timed out or failed a later step threw away
        # every date and match it had fetched, and the rerun fetched them all
        # again.
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/cache/fotmob
          key: fotmob-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soccer-study-${{ inputs.season }}
          path: study/
          if-no-files-found: ignore
