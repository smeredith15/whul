# The standings as they would be under each best-game proposal.
#
# Reads the latest day's published scores from the database and each rostered
# player's games: nflverse's weekly lines, the Stats API's MLB game logs, and
# the stored soccer lines. The Stats API answers from GitHub Actions and not
# from the sandbox this project is developed in, which is why this runs here.
# About forty game-log requests.
#
# It writes nothing back. Nothing in the standings changes.

name: Proposal scores

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e .

      - name: Restore the database
        run: |
          mkdir -p data
          git fetch origin data --depth 1
          git checkout origin/data -- data/whul.sqlite3

      - name: Score the proposals
        # pipefail, or `tee` reports success however the command exited.
        run: |
          set -o pipefail
          python -m whul.cli proposal-scores --out proposal-scores \
            | tee proposal-scores.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proposal-scores
          path: |
            proposal-scores.txt
            proposal-scores.json
          if-no-files-found: ignore
