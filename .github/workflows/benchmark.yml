# Compute a benchmark, review it, and -- separately -- freeze it.
#
# The benchmark is the number every score in its group is divided by, so it
# decides what 100 means. Getting it wrong raises nothing: it produces a season
# of plausible, wrong standings. So computing and adopting are two acts here,
# as they are in docs/BENCHMARKS.md, and the second one needs a person to tick
# a box.
#
# It runs here because it needs the same open network the nightly job has. The
# agent sandbox this repository is developed in answers 403 to almost every
# sports host -- international soccer happens to be an exception, being served
# from raw.githubusercontent -- so a run there could compute two leagues and
# would quietly skip the rest.
#
# What it does NOT do is recompute the whole scale. `benchmarks derive` copies
# the frozen version's rows into a fresh draft and only the named leagues are
# recomputed into it. A frozen scale is never edited, and a new version has to
# cover the whole roster before it can be frozen -- without derive, correcting
# one league would mean redoing the other twenty, some of which walk dates for
# an hour, and in practice the correction would not get made.

name: Benchmarks

# The dispatch form is a narrow dropdown and GitHub prints each description
# above its field, so the descriptions here are one line each. The reasoning
# behind them lives below, where there is room for it.
#
# `leagues`  Keys from `benchmarks list`, space separated, or `all`. Only these
#            are recomputed; every other group is inherited from the frozen
#            scale. There is deliberately no default: a default here once sent
#            a run at the league it was last used for and returned numbers
#            identical to the frozen ones, which reads exactly like a change
#            that did nothing. To correct one league without walking the rest,
#            name its own key -- `mls-players` pulls MLS and its two cups where
#            `soccer-players` pulls six leagues and eleven competitions. Never
#            name both: the group would be computed twice and the run would
#            keep whichever finished last.
#
# `seasons`  Leave empty, which is right: each league carries its own depth
#            (five for most, eight for international soccer, two full four-year
#            cycles, because five holds one World Cup and either one
#            continental championship or two depending on where it starts).
#            Set a number only to override every league at once.
#
# `freeze`   Leave unticked on the first run, read the comparison, and tick it
#            on a second run only if the numbers are right. Freezing refuses
#            while any rostered asset lacks a benchmark.
#
# `version`  Continue an existing draft instead of starting one. With leagues
#            named it computes them *into* that draft; with the box empty it
#            freezes it. This is what makes a long recompute splittable: the
#            six club-soccer leagues are about twelve hours cold and a job is
#            capped at six, so name three, then run again with Version set to
#            the draft this one reports and the other three.

on:
  workflow_dispatch:
    inputs:
      leagues:
        description: "Keys from `benchmarks list`, space separated, or `all`"
        default: ""
      seasons:
        description: "Seasons in the pool. Leave empty -- each league has its own"
        default: ""
      freeze:
        description: "Adopt the draft as the scale (read the comparison first)"
        type: boolean
        default: false
      version:
        description: "Freeze this existing draft instead of computing"
        default: ""

permissions:
  contents: write   # to push the database back to the data branch

concurrency:
  # Shares the nightly job's group on purpose: both write the same database on
  # the same branch, and the loser of a race would have its work force-pushed
  # away by the winner.
  group: publish
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Say which leagues
        # A compute run with no leagues named would silently mean "all of
        # them" -- twenty leagues, some of which walk dates for an hour. The
        # box is empty on purpose so that the operator has to say.
        #
        # It reports what it actually received. The first version said only
        # what was wanted, which is no help at all when the box looked filled
        # in: an empty `leagues` and a `leagues` that did not reach the run
        # produce the same message, and they have different fixes.
        if: ${{ !inputs.version && !inputs.leagues }}
        run: |
          echo "::error::No leagues named, so there is nothing to compute."
          echo "This run received:"
          echo "  leagues  '${{ inputs.leagues }}'"
          echo "  seasons  '${{ inputs.seasons }}'"
          echo "  freeze   '${{ inputs.freeze }}'"
          echo "  version  '${{ inputs.version }}'"
          echo
          echo "Name the leagues to recompute -- keys from \`benchmarks list\`,"
          echo "space separated -- or type 'all'. To freeze a draft that already"
          echo "exists, put its version in Version and leave this empty."
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e .

      - name: Restore the feed cache
        # Every date this walks is cached to disk, and without this the cache
        # was thrown away at the end of every run. A cold pass over the six
        # club-soccer leagues is 140 date-walks and about twelve hours; the
        # same pass with the dates on disk is a fraction of that, because the
        # walk still happens but each date is a file read.
        #
        # Its own key prefix rather than the publish job's. The two barely
        # overlap -- that one fetches today and this one fetches five years of
        # history -- and sharing a prefix would have each evicting the other
        # under the repository cache limit.
        uses: actions/cache@v4
        with:
          path: data/cache
          key: bench-cache-${{ github.run_id }}
          restore-keys: |
            bench-cache-

      - name: Take the database from the data branch
        run: |
          mkdir -p data
          git fetch origin data --depth 1
          git checkout origin/data -- data/whul.sqlite3
          # `git checkout <tree> -- <path>` stages the file as well as writing
          # it, and this job commits. Left in the index it would ride along in
          # the orphan commit below, which is where it belongs -- but staged
          # here it would also show up in any other commit, so it is taken out
          # and added back deliberately.
          git reset -q -- data/whul.sqlite3

      - name: Refresh the rosters from the draft file
        # The freeze is refused while a rostered asset has no benchmark, so the
        # roster has to be current or the check is against a stale one.
        run: python -m whul.cli import-rosters --season 2026-27 --write

      - name: Start a draft from the frozen scale
        if: ${{ !inputs.version }}
        run: |
          python -m whul.cli benchmarks derive frozen \
            --notes "recomputing ${{ inputs.leagues }}" | tee derive.txt
          # "  <draft> holds N benchmark(s), copied from <frozen>."
          echo "DRAFT=$(awk '/copied from/ {print $1}' derive.txt)" >> "$GITHUB_ENV"
          echo "FROM=$(awk '/copied from/ {print $NF}' derive.txt | tr -d .)" \
            >> "$GITHUB_ENV"

      - name: Use the draft named in the inputs
        if: ${{ inputs.version }}
        run: |
          echo "DRAFT=${{ inputs.version }}" >> "$GITHUB_ENV"
          # The comparison is always against the frozen scale, which the derive
          # step reports and a continuing run has to look up.
          python - <<'PY' >> "$GITHUB_ENV"
          from whul.config.league import SEASON
          from whul.store import open_store
          from whul.store import benchmarks as bm
          active = bm.active_version(open_store("data/whul.sqlite3"), SEASON.label)
          print(f"FROM={active.version if active else ''}")
          PY

      - name: Compute
        id: compute
        # Whenever leagues are named, whether the draft is new or continuing.
        # A twelve-hour compute does not fit in a six-hour job, so it has to be
        # splittable: name three leagues, then run again with Version set to
        # the same draft and the other three. Before this, naming a version
        # skipped the compute entirely and the only way to recompute six
        # leagues was one run that could not finish.
        if: ${{ inputs.leagues }}
        # Below the runner's own six-hour limit, which cancels the job outright
        # -- no database saved, no cache saved, no report, and the whole walk
        # thrown away. Stopping first means the draft keeps what it computed,
        # the dates it fetched stay on disk for the next run, and the report
        # says what is still inherited.
        timeout-minutes: 300
        # Failing here would skip the review and throw away the draft, so the
        # failure is carried to the end of the job instead -- see "A league did
        # not compute". The database is still saved and the comparison still
        # printed; the job just does not go green.
        continue-on-error: true
        env:
          LEAGUES: ${{ inputs.leagues }}
          SEASONS: ${{ inputs.seasons }}
        run: |
          # `all` is spelled out rather than left as an empty box, so that
          # recomputing twenty leagues is something a person chose.
          if [ "$LEAGUES" = "all" ]; then LEAGUES=""; fi
          # An empty --seasons is not the same as the default: omitting the
          # flag lets each Source name its own pool depth.
          python -m whul.cli benchmarks compute $LEAGUES \
            ${SEASONS:+--seasons "$SEASONS"} --save --into "$DRAFT" \
            | tee -a benchmarks.txt

      # Both of these are the review, and both are worth reading before the
      # box gets ticked. `coverage` exits non-zero while anything is uncovered,
      # which is a fact to report rather than a reason to stop.
      - name: What the draft covers
        continue-on-error: true
        run: python -m whul.cli benchmarks coverage "$DRAFT" | tee -a benchmarks.txt

      - name: What adopting it would change
        if: ${{ env.FROM }}
        continue-on-error: true
        run: |
          python -m whul.cli benchmarks compare "$FROM" "$DRAFT" | tee -a benchmarks.txt

      - name: Freeze
        # Never freeze a draft one of whose groups was inherited rather than
        # computed. On a version-only run compute is skipped, not failed, so
        # this still allows the second-pass freeze it was built for.
        if: ${{ inputs.freeze && steps.compute.outcome != 'failure' }}
        run: python -m whul.cli benchmarks freeze "$DRAFT" | tee -a benchmarks.txt

      - name: Save the database
        run: |
          git config user.name "whul-bot"
          git config user.email "whul-bot@users.noreply.github.com"
          git checkout --orphan data-tmp
          git rm -rq --cached . || true
          git add -f data/whul.sqlite3
          git commit -qm "Benchmarks: ${{ inputs.leagues }} $(date -u +%Y-%m-%d)"
          git push -f origin data-tmp:data

      - name: What to do next
        run: |
          echo "==================================================="
          echo "  Draft: $DRAFT"
          if [ "${{ inputs.freeze }}" = "true" ]; then
            echo "  FROZEN. Run 'Publish standings' with backfill to rescore."
          else
            echo "  Nothing is frozen yet."
            echo
            echo "  More leagues to compute? Run this again with Version set to"
            echo "    $DRAFT"
            echo "  and only the leagues still to do in Leagues. Every date this"
            echo "  run fetched is cached, so a repeat is far cheaper."
            echo
            echo "  Done computing? Read the comparison above, then run this"
            echo "  again with Freeze ticked, Version set to the draft, and"
            echo "  Leagues empty."
          fi
          echo "==================================================="

      - name: A league did not compute
        # A green run is how a person decides a draft is ready to freeze, so a
        # draft with an inherited group standing in for a computed one must not
        # produce one. The group is not empty -- it holds whatever the draft was
        # derived from -- which is exactly why this has to be said out loud.
        if: ${{ steps.compute.outcome == 'failure' }}
        run: |
          echo "::error::At least one league failed to compute. Its group still" \
               "holds the value inherited from the frozen scale. Read the FAILED" \
               "line above, fix it, and re-run before freezing $DRAFT."
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmarks
          path: |
            benchmarks.txt
            derive.txt
          if-no-files-found: warn
