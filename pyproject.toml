[project]
name = "whul"
version = "0.1.0"
description = "Cross-sport fantasy league scoring engine and web app"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "pyarrow>=15", "requests>=2.31", "beautifulsoup4>=4.12", "lxml>=5.0", "pyreadr>=0.5", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Discovery is pinned rather than automatic. A stray top-level directory --
# a data/ folder, a scratch checkout -- otherwise reads as a second package
# and setuptools refuses to build at all rather than guessing.
[tool.setuptools.packages.find]
include = ["whul*"]

# The tournament calendar ships with the package. It is versioned data the
# scoring depends on, not a file the user is expected to supply.
[tool.setuptools.package-data]
whul = ["data/*.csv", "store/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: test requires outbound network access"]
